name: label-sync
# Once a day: ask each source repo for its head commit. If nothing moved, this finishes in seconds and changes nothing.
# If only the pinned commits moved (no label changed), the bump is committed directly so the freshness banner stays honest.
# If a label changed, a pull request carries the diff of labels/*.json and the regenerated docs for a human to review.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: sync labels from registries, Atlas and the Morpho curator registry
        id: sync
        run: |
          set +e
          npm run sync:labels
          code=$?
          set -e
          echo "level=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "10" ] && [ "$code" != "20" ]; then exit "$code"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: rebuild the Sky vault list from rate limits, positions, registries and the Atlas
        id: vaults
        run: |
          set +e
          npm run sync:vaults
          code=$?
          set -e
          echo "level=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "20" ]; then exit "$code"; fi
      - name: re-read Safe owners when labels changed
        if: steps.sync.outputs.level == '20' || steps.vaults.outputs.level == '20'
        run: npm run read:safes
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      - name: regenerate the human-readable tables
        run: npm run gen:docs
      - name: commit a pin-only bump directly
        if: steps.sync.outputs.level == '10' && steps.vaults.outputs.level != '20'
        run: |
          git config user.name "label-sync"
          git config user.email "label-sync@users.noreply.github.com"
          git add labels config docs
          git commit -m "labels: bump source commits (no label changed)" || echo "nothing to commit"
          git push
      - name: open a pull request when labels changed
        if: steps.sync.outputs.level == '20' || steps.vaults.outputs.level == '20'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: label-sync/update
          title: "labels: upstream change detected"
          commit-message: "labels: update from registries / Atlas / curator registry"
          body: |
            The daily sync found a change in a public label source. Review the diff of `labels/*.json` and the regenerated
            `docs/ADDRESS_BOOK.md` / `docs/SAFES.md`, then merge. Nothing is applied until this is merged.
          labels: labels
