name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: tests (unit, parser, regression on recorded fixtures, scrub)
        run: npm test
        env:
          # regex of personal names that must not appear anywhere in the repo; kept out of the repo on purpose
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
      - name: generated docs are up to date
        run: npm run gen:docs -- --check
      - run: npm run build
